<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1e1e2e" />
    <meta name="description" content="咸鱼小窝，一个可以真正敲命令的终端风个人主页。" />
    <title>guest@fishqaq.com: ~</title>
    <!-- 在样式和脚本加载前定好主题，避免首屏闪一下错误的颜色 -->
    <script>
      (function () {
        var mode = null;
        try { mode = localStorage.getItem('term:theme'); } catch (e) {}
        var dark = mode ? mode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <style>
      html { background: #dce0e8; }
      html[data-theme='dark'] { background: #11111b; }
    </style>
    <!-- 放在 head 里阻塞渲染；如果在 main.ts 里 import，开发模式下要等 JS 跑完才有样式，会先闪一下没样式的页面 -->
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="titlebar">
        <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="title" id="title">guest@fishqaq.com: ~</span>
      </header>
      <div id="terminal"></div>
      <nav id="keys" aria-label="终端按键">
        <button type="button" data-key="tab">Tab</button>
        <button type="button" data-key="up">↑</button>
        <button type="button" data-key="down">↓</button>
        <button type="button" data-key="left">←</button>
        <button type="button" data-key="right">→</button>
        <button type="button" data-key="ctrl-c">^C</button>
        <button type="button" data-key="ctrl-r">^R</button>
        <button type="button" data-key="ctrl-l">^L</button>
      </nav>
    </div>

    <!-- comment 命令打开的留言板，样式和上面的终端窗口一致；红点就是关闭按钮 -->
    <div id="comment" class="overlay" hidden>
      <div class="comment-window" role="dialog" aria-modal="true" aria-labelledby="comment-title" tabindex="-1">
        <header class="titlebar">
          <span class="dots"><button type="button" class="dot-close" aria-label="关闭留言板" data-close></button><i></i><i></i></span>
          <span class="title" id="comment-title">guest@fishqaq.com: ~/comment</span>
          <button type="button" class="close-x" aria-label="关闭留言板" data-close>×</button>
        </header>
        <div class="comment-body"><div id="tcomment"></div></div>
      </div>
    </div>

    <!-- 给搜索引擎、读屏软件和禁用 JS 的访客看的纯文本版本，改了 content/ 记得同步 -->
    <main id="fallback" class="sr-only">
      <h1>咸鱼小窝</h1>
      <p>欢迎来到咸鱼小窝。</p>
      <h2>联系方式</h2>
      <ul>
        <li><a href="https://github.com/f1shQAQ">GitHub</a></li>
        <li><a href="https://space.bilibili.com/98661069">bilibili</a></li>
        <li><a href="https://steamcommunity.com/profiles/76561199187994629">Steam</a></li>
        <li><a href="https://blog.fishqaq.com/wechat">WeChat</a></li>
        <li><a href="https://weibo.com/u/6995301021">Weibo</a></li>
        <li>Mail: npm#vip.qq.com（把 # 换成 @）</li>
      </ul>
    </main>
    <noscript>
      <style>
        #app { display: none; }
        #fallback { position: static; width: auto; height: auto; clip: auto; margin: 0 auto; max-width: 720px; padding: 24px; }
      </style>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
